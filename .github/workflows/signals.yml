# Turn the app's anonymous signals into issues and a digest, nightly.
#
# The app counts errors, failed saves, agent tool calls, slow steps and
# friction (apps/desktop/src/signals) and posts them to the update Worker
# (POST /signals), which keeps them in R2. This reads the last seven days
# (GET /signals/day/<day>), opens or refreshes one issue labelled
# "app signal" per failure, and rewrites one digest issue of paper cuts that
# the evening bug sweep reads. See workers/updater/file-signals.mjs.
#
# The read key is the same SYNC_KEY reports.yml uses, derived the same way
# from CLOUDFLARE_API_TOKEN, so there is no secret to add here.

name: Signals

on:
  schedule:
    # 21:23 UTC (16:23 Toronto), before the 17:42 Toronto bug sweep.
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: redbeam-signals
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: workers/updater
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: File the week's signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN must be an Actions secret. See docs/UPDATES.md." >&2
            exit 1
          fi
          SYNC_KEY=$(printf 'redbeam-report-sync:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$SYNC_KEY"
          export SYNC_KEY
          node workers/updater/file-signals.mjs
